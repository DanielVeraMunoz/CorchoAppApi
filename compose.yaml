# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    ports:
      - 9000:80
    # Wait for MySQL to be healthy before starting Laravel
    depends_on:
      db:
        condition: service_healthy
    # Environment variables passed to Laravel (override .env inside the container)
    environment:
      APP_ENV: local
      APP_URL: http://localhost:9000
      APP_KEY: ${APP_KEY}  
      DB_CONNECTION: mysql
      DB_HOST: db        # name of the db service below — NOT 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: corchoapp
      DB_USERNAME: root
      DB_PASSWORD: secret

  # MySQL service — downloaded from Docker Hub, no Dockerfile needed
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: corchoapp
    ports:
      - 3307:3306        # 3307 on your Mac to avoid conflict with XAMPP's MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

